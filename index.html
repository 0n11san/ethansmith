<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethan Smith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #1a6aa8;
    --panel: #3aa3e3;
    --blob: #62bcf0;
    --cream: #fff3d6;
    --coral: #f2604f;
    --purple: #4a2f8f;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page);
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    padding: 16px;
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
  }
  .hero {
    flex: 1;
    max-width: 1120px;
    margin: 0 auto;
    background: var(--panel);
    border-radius: 36px;
    padding: clamp(24px, 5vw, 56px);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 3vw, 32px);
    text-align: center;
    box-shadow: 0 14px 0 -6px rgba(0,0,0,.18);
  }
  .blob { position: absolute; border-radius: 50%; pointer-events: none; background: var(--blob); }
  .blob.b1 { width: 620px; height: 620px; right: -140px; bottom: -260px; }
  .blob.b2 { width: 260px; height: 260px; left: -80px; top: -90px; opacity: .7; }

  h1 {
    position: relative; z-index: 2;
    font-size: clamp(5rem, min(22vw, 23vh), 14rem);
    line-height: 1;
    color: var(--cream);
    text-shadow: 0 6px 0 var(--coral), 0 12px 0 rgba(0,0,0,.12);
  }
  h1 span { display: block; }

  .stage { position: relative; z-index: 2; aspect-ratio: 3 / 1; width: 100%; max-width: min(900px, 105vh); margin-inline: auto; }
  .stage svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .char {
    position: absolute; background: none; border: 0; padding: 0; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .char:focus-visible { outline: 4px solid var(--purple); outline-offset: 4px; }
  .char.icecream{ width: 14%; left: 6%;  top: 4%;    animation: floaty 3.6s ease-in-out -2s infinite; }
  .char.minion  { width: 21%; left: 22%; bottom: -4%; animation: bob 3.2s ease-in-out infinite; }
  .char.frog    { width: 23%; left: 50%; bottom: -6%; animation: bob 2.6s ease-in-out -1s infinite; }
  .char.rocket  { width: 17%; right: 5%; top: -4%;   animation: floaty 4s ease-in-out infinite; }
  .char.pop svg { animation: pop .6s ease; }
  .char.rocket.launch { animation: launch 1.3s cubic-bezier(.5,0,.9,.4) forwards; }

  .stage svg.sparkle { position: absolute; height: auto; aspect-ratio: 1; width: 9%; color: #fff; animation: twinkle 2.4s ease-in-out infinite; pointer-events: none; }
  .stage svg.sparkle.s1 { left: 34%; top: 6%;  width: 4%; }
  .stage svg.sparkle.s2 { right: 24%; top: 34%; width: 3%; animation-delay: -.8s; }
  .stage svg.sparkle.s3 { left: 1%; top: 58%;  width: 2.6%; animation-delay: -1.5s; }
  .stage svg.sparkle.s4 { right: 1%; bottom: 8%; width: 3%; animation-delay: -.4s; }

  @keyframes bob     { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-3%) rotate(1.5deg); } }
  @keyframes floaty  { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6%) rotate(3deg); } }
  @keyframes twinkle { 0%,100% { transform: scale(.6) rotate(0); opacity: .5; } 50% { transform: scale(1.1) rotate(20deg); opacity: 1; } }
  @keyframes pop     { 0% { transform: scale(1); } 30% { transform: scale(1.18) rotate(-6deg); } 60% { transform: scale(.94) rotate(4deg); } 100% { transform: scale(1); } }
  @keyframes launch  { 0% { transform: translateY(0); } 15% { transform: translateY(6%); } 100% { transform: translateY(-260%); opacity: 0; } }

  @media (max-width: 820px) {
    .stage { aspect-ratio: 1 / 1; max-width: 380px; }
    .char.icecream{ width: 26%; left: 8%;  top: 4%; }
    .char.minion  { width: 40%; left: 4%;  bottom: 6%; }
    .char.frog    { width: 44%; left: 40%; bottom: 0; }
    .char.rocket  { width: 34%; right: 2%; top: 0; }
    .stage svg.sparkle.s1 { left: 42%; top: 6%;  width: 9%; }
    .stage svg.sparkle.s2 { right: 4%; top: 50%; width: 7%; }
    .stage svg.sparkle.s3 { left: 0; top: 46%;   width: 6%; }
    .stage svg.sparkle.s4 { right: 34%; bottom: 3%; width: 5%; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- four-point sparkle -->
    <symbol id="sparkle" viewBox="0 0 20 20">
      <path fill="currentColor" d="M10 0 Q11.2 8.8 20 10 Q11.2 11.2 10 20 Q8.8 11.2 0 10 Q8.8 8.8 10 0Z"/>
    </symbol>

    <!-- ROCKET SHIP -->
    <symbol id="rocket" viewBox="0 0 200 200">
      <g transform="rotate(32 100 100) translate(0 -4)">
        <!-- flame -->
        <path d="M84 152 Q100 205 116 152 Z" fill="#ffb347"/>
        <path d="M92 152 Q100 184 108 152 Z" fill="#ffe082"/>
        <!-- fins -->
        <path d="M72 100 Q40 118 38 156 L74 140 Z" fill="#1f7fc4"/>
        <path d="M128 100 Q160 118 162 156 L126 140 Z" fill="#1f7fc4"/>
        <!-- body -->
        <path d="M100 14 C134 44 140 100 130 146 L70 146 C60 100 66 44 100 14 Z" fill="#f2604f"/>
        <path d="M100 14 C112 26 120 40 124 56 C112 46 104 44 100 44 Z" fill="#ff8574" opacity=".55"/>
        <!-- nozzle -->
        <rect x="80" y="144" width="40" height="12" rx="6" fill="#2b3a8f"/>
        <!-- window -->
        <circle cx="100" cy="82" r="21" fill="#ffb347"/>
        <circle cx="100" cy="82" r="14" fill="#2b3a8f"/>
        <circle cx="95" cy="77" r="4.5" fill="#fff" opacity=".8"/>
        <!-- stripe -->
        <rect x="68" y="118" width="64" height="9" fill="#fff3d6"/>
      </g>
    </symbol>

    <!-- ICE CREAM (two scoops) -->
    <symbol id="icecream" viewBox="0 0 200 200">
      <!-- cone -->
      <path d="M62 102 L138 102 L100 194 Z" fill="#f5b324"/>
      <path d="M62 102 L138 102 L131 119 L69 119 Z" fill="#e59a0f" opacity=".5"/>
      <path d="M78 126 L122 126 M88 148 L112 148 M74 108 L108 178 M126 108 L92 178" stroke="#e59a0f" stroke-width="4" stroke-linecap="round" fill="none"/>
      <!-- bottom scoop w/ drippy edge -->
      <path d="M52 100 C48 76 66 62 100 62 C134 62 152 76 148 100
               C148 110 138 112 134 106 C132 116 118 116 116 106 C112 114 100 114 96 106 C92 114 78 114 76 106 C72 112 54 112 52 100 Z" fill="#ff8fa3"/>
      <!-- top scoop -->
      <circle cx="100" cy="52" r="34" fill="#fff3d6"/>
      <path d="M72 62 Q100 78 128 62" stroke="#f5dfa8" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- cherry -->
      <path d="M100 20 Q106 8 116 6" stroke="#4a8f3f" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="100" cy="24" r="10" fill="#e0243b"/>
      <circle cx="97" cy="21" r="3" fill="#fff" opacity=".7"/>
      <!-- sprinkles -->
      <g stroke-width="5" stroke-linecap="round">
        <path d="M84 44 l6 -3" stroke="#2b86c5"/><path d="M110 48 l6 3" stroke="#f2604f"/>
        <path d="M96 60 l3 6" stroke="#dce85a"/><path d="M118 62 l-4 5" stroke="#2b86c5"/>
        <path d="M76 84 l6 2" stroke="#fff3d6"/><path d="M104 88 l6 -3" stroke="#ffd23f"/>
        <path d="M126 84 l5 4" stroke="#4a2f8f"/>
      </g>
    </symbol>

    <!-- YELLOW FROG (a Polliwog-style buddy) -->
    <symbol id="frog" viewBox="0 0 200 200">
      <!-- back legs -->
      <ellipse cx="52" cy="160" rx="30" ry="24" fill="#ffd23f"/>
      <ellipse cx="148" cy="160" rx="30" ry="24" fill="#ffd23f"/>
      <!-- toes -->
      <g fill="#ffd23f">
        <circle cx="26" cy="176" r="8"/><circle cx="40" cy="182" r="8"/><circle cx="54" cy="183" r="8"/>
        <circle cx="174" cy="176" r="8"/><circle cx="160" cy="182" r="8"/><circle cx="146" cy="183" r="8"/>
      </g>
      <!-- body -->
      <ellipse cx="100" cy="128" rx="54" ry="56" fill="#ffd23f"/>
      <ellipse cx="100" cy="140" rx="34" ry="40" fill="#ffe98a"/>
      <!-- arms up! -->
      <path d="M58 120 Q34 100 30 66" stroke="#ffd23f" stroke-width="20" stroke-linecap="round" fill="none"/>
      <path d="M142 120 Q166 100 170 66" stroke="#ffd23f" stroke-width="20" stroke-linecap="round" fill="none"/>
      <g fill="#ffd23f">
        <circle cx="24" cy="58" r="9"/><circle cx="34" cy="52" r="9"/><circle cx="44" cy="58" r="9"/>
        <circle cx="176" cy="58" r="9"/><circle cx="166" cy="52" r="9"/><circle cx="156" cy="58" r="9"/>
      </g>
      <!-- head -->
      <ellipse cx="100" cy="82" rx="52" ry="38" fill="#ffd23f"/>
      <!-- eyes -->
      <circle cx="72" cy="48" r="22" fill="#ffd23f"/><circle cx="128" cy="48" r="22" fill="#ffd23f"/>
      <circle cx="72" cy="46" r="17" fill="#fff"/><circle cx="128" cy="46" r="17" fill="#fff"/>
      <circle cx="75" cy="48" r="8" fill="#5a2d0c"/><circle cx="125" cy="48" r="8" fill="#5a2d0c"/>
      <circle cx="78" cy="45" r="3" fill="#fff"/><circle cx="128" cy="45" r="3" fill="#fff"/>
      <!-- smile -->
      <path d="M66 88 Q100 122 134 88" stroke="#a5570f" stroke-width="5" fill="#ff9a8a" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- cheeks -->
      <circle cx="58" cy="90" r="7" fill="#ff9a5c" opacity=".6"/><circle cx="142" cy="90" r="7" fill="#ff9a5c" opacity=".6"/>
      <!-- orange spots -->
      <g fill="#f59e0b">
        <circle cx="86" cy="72" r="4"/><circle cx="102" cy="68" r="3.5"/><circle cx="116" cy="74" r="4"/>
        <circle cx="70" cy="118" r="5"/><circle cx="130" cy="122" r="5"/><circle cx="52" cy="158" r="5"/>
        <circle cx="148" cy="160" r="5"/><circle cx="86" cy="106" r="3"/><circle cx="118" cy="104" r="3"/>
      </g>
      <!-- nostrils -->
      <circle cx="94" cy="80" r="2" fill="#a5570f"/><circle cx="106" cy="80" r="2" fill="#a5570f"/>
    </symbol>

    <!-- YELLOW GOGGLE BUDDY (minion-style) -->
    <symbol id="minion" viewBox="0 0 200 200">
      <!-- hair -->
      <g stroke="#3a3f4a" stroke-width="2.5" stroke-linecap="round" fill="none">
        <path d="M100 26 Q92 8 80 4"/><path d="M100 26 Q98 6 96 -2"/><path d="M100 26 Q104 6 112 0"/><path d="M100 26 Q110 10 122 8"/>
      </g>
      <!-- legs/shoes -->
      <rect x="74" y="168" width="20" height="14" rx="4" fill="#2b86c5"/>
      <rect x="106" y="168" width="20" height="14" rx="4" fill="#2b86c5"/>
      <ellipse cx="82" cy="186" rx="17" ry="9" fill="#3a3f4a"/>
      <ellipse cx="118" cy="186" rx="17" ry="9" fill="#3a3f4a"/>
      <!-- arms -->
      <ellipse cx="48" cy="130" rx="11" ry="20" fill="#ffd23f" transform="rotate(28 48 130)"/>
      <ellipse cx="152" cy="130" rx="11" ry="20" fill="#ffd23f" transform="rotate(-28 152 130)"/>
      <circle cx="42" cy="148" r="10" fill="#3a3f4a"/><circle cx="158" cy="148" r="10" fill="#3a3f4a"/>
      <!-- body -->
      <rect x="56" y="22" width="88" height="152" rx="44" fill="#ffd23f"/>
      <!-- overalls -->
      <path d="M56 116 H144 V132 Q144 174 100 174 Q56 174 56 132 Z" fill="#2b86c5"/>
      <rect x="76" y="104" width="48" height="30" rx="7" fill="#2b86c5"/>
      <path d="M62 112 L78 108 M138 112 L122 108" stroke="#2b86c5" stroke-width="9" stroke-linecap="round"/>
      <rect x="86" y="120" width="28" height="24" rx="6" fill="#1a6aa8"/>
      <circle cx="100" cy="132" r="7" fill="none" stroke="#f0f4f8" stroke-width="2.5"/>
      <circle cx="79" cy="112" r="3" fill="#f0c94a"/><circle cx="121" cy="112" r="3" fill="#f0c94a"/>
      <!-- goggle strap -->
      <rect x="56" y="56" width="88" height="11" fill="#3a3f4a"/>
      <!-- goggles -->
      <circle cx="80" cy="62" r="21" fill="#c9d1d9"/><circle cx="120" cy="62" r="21" fill="#c9d1d9"/>
      <circle cx="80" cy="62" r="15" fill="#fff"/><circle cx="120" cy="62" r="15" fill="#fff"/>
      <circle cx="82" cy="63" r="7" fill="#6b3a1e"/><circle cx="118" cy="63" r="7" fill="#6b3a1e"/>
      <circle cx="82" cy="63" r="3" fill="#1c1208"/><circle cx="118" cy="63" r="3" fill="#1c1208"/>
      <circle cx="84" cy="60" r="2" fill="#fff"/><circle cx="120" cy="60" r="2" fill="#fff"/>
      <!-- smile -->
      <path d="M82 96 Q100 110 118 96" stroke="#7a4a12" stroke-width="4" fill="#fff" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<main class="hero">
  <div class="blob b1"></div><div class="blob b2"></div>

  <h1><span>Ethan</span><span>Smith</span></h1>

  <div class="stage">
    <svg class="sparkle s1" viewBox="0 0 20 20" aria-hidden="true"><use href="#sparkle"/></svg>
    <svg class="sparkle s2" viewBox="0 0 20 20" aria-hidden="true"><use href="#sparkle"/></svg>
    <svg class="sparkle s3" viewBox="0 0 20 20" aria-hidden="true"><use href="#sparkle"/></svg>
    <svg class="sparkle s4" viewBox="0 0 20 20" aria-hidden="true"><use href="#sparkle"/></svg>

    <button class="char icecream" aria-label="Ice cream"><svg viewBox="0 0 200 200"><use href="#icecream"/></svg></button>
    <button class="char rocket"   aria-label="Rocket, tap to blast off"><svg viewBox="0 0 200 200"><use href="#rocket"/></svg></button>
    <button class="char minion"   aria-label="Goggle buddy"><svg viewBox="0 0 200 200"><use href="#minion"/></svg></button>
    <button class="char frog"     aria-label="Yellow frog"><svg viewBox="0 0 200 200"><use href="#frog"/></svg></button>
  </div>
</main>

<script>
  document.querySelectorAll(".char").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.classList.contains("rocket")) {
        if (btn.classList.contains("launch")) return;
        btn.classList.add("launch");
        setTimeout(() => btn.classList.remove("launch"), 2600);
        return;
      }
      btn.classList.remove("pop");
      void btn.offsetWidth;
      btn.classList.add("pop");
    });
  });
</script>
</body>
</html>
